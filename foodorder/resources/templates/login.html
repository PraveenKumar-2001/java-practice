<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.container{
    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:blue;
    color:white;
    border:none;
}

.error{
    color:red;
}

.success{
    color:green;
}

</style>

</head>
<body>

<div class="container">

<h2>Login Form</h2>

<div th:if="${param.error}" class="error">
    Invalid Username or Password
</div>

<div th:if="${param.logout}" class="success">
    Logout Successful
</div>

<form th:action="@{/login}" method="post">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">
        Login
    </button>

</form>

</div>

</body>
</html>
